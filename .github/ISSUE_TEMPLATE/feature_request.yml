name: Feature request
description: Define a product or engineering improvement and its acceptance criteria.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user need
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Affected platforms
      multiple: true
      options: [iOS, Android, Backend, Website / Admin, Repository tooling]
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful solution and boundaries
      description: Identify shared contracts and intentional platform differences. Existing app versions may release independently.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria by affected platform
      description: Separate implementation, automated checks, device acceptance and publication. Link platform sub-issues for larger work.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Existing behavior / versions / alternatives
      description: Link current state, related issues and simpler alternatives. Do not include private data.
