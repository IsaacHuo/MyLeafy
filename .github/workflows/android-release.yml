name: Cut Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Android versionName to release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cut-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify, sign and publish to Cloudflare and GitHub
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify main and resolve immutable release
        id: meta
        env:
          VERSION_INPUT: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          [[ "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          EXPECTED="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          test "$VERSION_INPUT" = "$EXPECTED"
          TAG="android-v${VERSION_INPUT}"
          RELEASE_ID="$(gh api graphql -f query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){databaseId}}}' -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F tag="$TAG" --jq '.data.repository.release.databaseId // empty')"
          if test -n "$RELEASE_ID"; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/existing-release.json"
          else
            echo null > "$RUNNER_TEMP/existing-release.json"
          fi
          if jq -e '. != null' "$RUNNER_TEMP/existing-release.json" >/dev/null; then
            test "$(jq -r '.target_commitish' "$RUNNER_TEMP/existing-release.json")" = "$GITHUB_SHA"
            APK_NAME="MyLeafy-Android-${VERSION_INPUT}.apk"
            if jq -e --arg name "$APK_NAME" '.assets | any(.name == $name)' "$RUNNER_TEMP/existing-release.json" >/dev/null; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              APK_ASSET_ID="$(jq -r --arg name "$APK_NAME" '.assets[] | select(.name == $name) | .id' "$RUNNER_TEMP/existing-release.json")"
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$APK_ASSET_ID" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/$APK_NAME"
              if jq -e --arg name "$APK_NAME-build-info.txt" '.assets | any(.name == $name)' "$RUNNER_TEMP/existing-release.json" >/dev/null; then
                MANIFEST_ASSET_ID="$(jq -r --arg name "$APK_NAME-build-info.txt" '.assets[] | select(.name == $name) | .id' "$RUNNER_TEMP/existing-release.json")"
                gh api "repos/$GITHUB_REPOSITORY/releases/assets/$MANIFEST_ASSET_ID" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/$APK_NAME-build-info.txt"
              fi
            fi
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo 'Existing tag has no matching release. Resolve it explicitly.' >&2
            exit 1
          fi
          echo "version=$VERSION_INPUT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify tests and lint
        run: |
          python -m unittest discover -s ../backend/scripts -p 'test_*.py'
          ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Restore release key
        if: steps.meta.outputs.reuse != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/myleafy-release.jks"
          echo "MYLEAFY_RELEASE_STORE_FILE=$RUNNER_TEMP/myleafy-release.jks" >> "$GITHUB_ENV"

      - name: Build signed official APK
        if: steps.meta.outputs.reuse != 'true'
        env:
          MYLEAFY_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          MYLEAFY_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          MYLEAFY_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:lintRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/MyLeafy-Android-${{ steps.meta.outputs.version }}.apk"

      - name: Verify APK identity, certificate and manifest
        id: artifact
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REUSE: ${{ steps.meta.outputs.reuse }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/MyLeafy-Android-$VERSION.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner-report.txt"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          python - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          version=os.environ['VERSION']; apk=root/f'MyLeafy-Android-{version}.apk'
          manifest=apk.with_name(apk.name+'-build-info.txt')
          badging=(root/'apk-badging.txt').read_text()
          package,code,name=re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",badging).groups()
          minimum=int(re.search(r"sdkVersion:'(\d+)'",badging).group(1))
          certificate_report=(root/'apksigner-report.txt').read_text()
          certificates=set(value.lower() for value in re.findall(r'^Signer (?:#\d+|\(.+\)) certificate SHA-256 digest: ([a-fA-F0-9]{64})\s*$',certificate_report,re.MULTILINE))
          assert len(certificates)==1, 'Expected one consistent APK signing certificate across Android SDK ranges'
          certificate=certificates.pop()
          assert package=='com.myleafy.android' and name==version and minimum==29
          actual=hashlib.sha256(apk.read_bytes()).hexdigest()
          notes=pathlib.Path('../docs/operations/android-release-notes.md').read_text().strip()
          info=dict(packageName=package,channel='official',versionCode=int(code),versionName=version,minSdk=minimum,
              releaseNotes=notes,commit=os.environ['GITHUB_SHA'],artifactKey=f'android/official/{code}/{apk.name}',
              sizeBytes=apk.stat().st_size,sha256=actual,certificateSha256=certificate,
              githubReleaseUrl=f'https://github.com/IsaacHuo/MyLeafy/releases/tag/android-v{version}')
          if os.environ.get('REUSE')=='true' and manifest.exists():
              assert json.loads(manifest.read_text())==info, 'Stored release does not match verified commit and artifact'
          else:
              manifest.write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'apk={apk}\nmanifest={manifest}\n')
          PY

      - name: Keep package validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-validation-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/apksigner-report.txt
            ${{ runner.temp }}/apk-badging.txt
          if-no-files-found: ignore

      - name: Publish and verify both production catalogues
        env:
          MYLEAFY_RELEASE_PUBLISH_TOKEN: ${{ secrets.MYLEAFY_RELEASE_PUBLISH_TOKEN }}
        run: python ../backend/scripts/publish-android-release.py --apk '${{ steps.artifact.outputs.apk }}' --manifest '${{ steps.artifact.outputs.manifest }}'

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/myleafy-release.jks"
