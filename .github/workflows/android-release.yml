name: Publish approved Android candidate
run-name: Android publication ${{ inputs.operation }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Publication authorization ID created by admin'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: android-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: android-production
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      MYLEAFY_RELEASE_PUBLISH_TOKEN: ${{ secrets.MYLEAFY_RELEASE_PUBLISH_TOKEN }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
      - name: Claim authorization and verify accepted APK
        run: python backend/scripts/android-candidate.py claim --operation "$OPERATION" --output "$RUNNER_TEMP/publication"
      - name: Publish the same artifact and verify both catalogues
        run: python backend/scripts/publish-android-release.py --apk "$RELEASE_APK" --manifest "$RELEASE_MANIFEST" --operation "$OPERATION"
      - name: Publication summary
        run: |
          echo "Published and verified approved artifact from $RELEASE_SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
          cat "$RELEASE_MANIFEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Report failure
        if: failure()
        run: python backend/scripts/android-candidate.py fail --operation "$OPERATION"
