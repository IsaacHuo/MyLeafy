name: Cut Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Android versionName to release"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

concurrency:
  group: cut-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify, sign and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use X.Y.Z numeric format." >&2
            exit 1
          fi
          EXPECTED="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "Requested version $VERSION does not match app versionName $EXPECTED." >&2
            exit 1
          fi
          TAG="android-v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; release tags are immutable." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare public service configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.ANDROID_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.ANDROID_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > secrets.properties

      - name: Restore Android release key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/myleafy-release.jks"
          echo "MYLEAFY_RELEASE_STORE_FILE=$RUNNER_TEMP/myleafy-release.jks" >> "$GITHUB_ENV"

      - name: Verify and build signed release
        shell: bash
        env:
          MYLEAFY_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          MYLEAFY_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          MYLEAFY_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Verify APK signature and write build manifest
        id: artifact
        shell: bash
        run: |
          APK="$RUNNER_TEMP/MyLeafy-Android-${{ steps.meta.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner-report.txt"
          APK_DIRECTORY="$(dirname "$APK")"
          APK_NAME="$(basename "$APK")"
          (cd "$APK_DIRECTORY" && sha256sum "$APK_NAME" > "${APK_NAME}.sha256")
          {
            echo "version=${{ steps.meta.outputs.version }}"
            echo "tag=${{ steps.meta.outputs.tag }}"
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "sha256=$(cut -d ' ' -f 1 "${APK}.sha256")"
            echo
            cat "$RUNNER_TEMP/apksigner-report.txt"
          } > "$RUNNER_TEMP/MyLeafy-Android-${{ steps.meta.outputs.version }}-build-info.txt"
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"

      - name: Publish Android GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.artifact.outputs.apk }}" \
            "${{ steps.artifact.outputs.apk }}.sha256" \
            "$RUNNER_TEMP/MyLeafy-Android-${{ steps.meta.outputs.version }}-build-info.txt" \
            --target "$GITHUB_SHA" \
            --title "MyLeafy Android ${{ steps.meta.outputs.version }}" \
            --notes-file ../docs/operations/android-release-notes.md
