name: Prepare Cloudflare staging
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: cloudflare-staging
  cancel-in-progress: false
jobs:
  backend:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backend-ci.yml
    with:
      full: true
  site:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/site-ci.yml
    with:
      full: true
  deploy:
    needs: [backend, site]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 30
    env:
      RELEASE_COMMIT: ${{ github.sha }}
      CLOUDFLARE_ACCOUNT_ID: be7d850d4b5046381fb909251b4df675
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 25.6.1
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            site/package-lock.json
      - name: Verify selected commit
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT/check-runs?per_page=100" --jq '.check_runs | any(.name == "CI result" and .conclusion == "success" and .app.slug == "github-actions")' | grep -qx true
      - name: Install locked dependencies
        run: |
          npm --prefix backend ci
          npm --prefix site ci
          npm --prefix site run build
      - name: Deploy and accept staging
        run: node backend/scripts/deploy-cloudflare.mjs staging
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-staging-${{ env.RELEASE_COMMIT }}
          path: deployment-report/
          if-no-files-found: ignore
