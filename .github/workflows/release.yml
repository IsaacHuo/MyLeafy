name: Record released iOS version
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full source commit of the Apple-released binary'
        required: true
        type: string
      version:
        description: 'Apple marketing version'
        required: true
        type: string
      build:
        description: 'Apple build number'
        required: true
        type: string
      apple_released:
        description: 'This version has actually been released through App Store Connect'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
  checks: read
concurrency:
  group: record-ios-release
  cancel-in-progress: false
jobs:
  record:
    if: github.ref == 'refs/heads/main' && inputs.apple_released
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
      - name: Verify source checks
        run: gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT/check-runs?per_page=100" --jq '.check_runs | any(.name == "CI result" and .conclusion == "success" and .app.slug == "github-actions")' | grep -qx true
      - name: Record immutable source and release
        run: python scripts/record-ios-release.py --commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION" --build "$RELEASE_BUILD"
