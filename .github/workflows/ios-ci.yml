name: iOS CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS 17 build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check patch and detect iOS changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --check "${BASE_SHA}...${HEAD_SHA}"
          if git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -Eq '^(leafy/|leafyTests/|leafyWidget/|LeafyWidgetShared/|LeafyShareExtension/|LeafyExternalImportShared/|Config/|leafy\.xcodeproj/|\.github/workflows/ios-ci\.yml$)'; then
            echo "ios_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ios_changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Cache Swift packages
        if: steps.changes.outputs.ios_changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/leafy-source-packages
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('leafy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Build for the iOS 17 deployment target
        if: steps.changes.outputs.ios_changed == 'true'
        run: |
          xcodebuild -quiet build \
            -project leafy.xcodeproj \
            -scheme leafy \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/leafy-source-packages" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO
