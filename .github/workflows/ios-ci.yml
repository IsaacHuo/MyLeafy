name: iOS CI

on:
  workflow_call:
    inputs:
      full:
        description: Run compilation and the complete regression suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.full && 'iOS 17 build and tests' || 'Swift and project checks' }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      TEST_RUNNER_LEAFY_UNIT_TESTING: "1"
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Swift formatting
        run: |
          bash scripts/format-swift.sh --check || {
            echo 'Run bash scripts/format-swift.sh on your task-owned files and commit the result.'
            exit 1
          }

      - name: Check project and property lists
        run: git ls-files -z -- '*.plist' '*.entitlements' '*.pbxproj' | xargs -0 plutil -lint

      - name: Cache Swift packages
        if: inputs.full
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/leafy-source-packages
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('leafy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Select test device
        if: inputs.full
        run: |
          xcodebuild -version
          LEAFY_TEST_DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "LEAFY_TEST_DEVICE=$LEAFY_TEST_DEVICE" >> "$GITHUB_ENV"
          echo "LEAFY_DERIVED_DATA=$RUNNER_TEMP/leafy-test-deriveddata" >> "$GITHUB_ENV"

      - name: Build once for the iOS 17 deployment target
        if: inputs.full
        run: |
          xcodebuild -quiet build-for-testing -project leafy.xcodeproj -scheme leafy \
            -configuration Debug -jobs 1 \
            -destination "platform=iOS Simulator,id=$LEAFY_TEST_DEVICE" \
            -derivedDataPath "$LEAFY_DERIVED_DATA" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/leafy-source-packages" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO

      - name: Offline XCTest without rebuilding
        if: inputs.full
        run: |
          xcodebuild -quiet test-without-building -project leafy.xcodeproj -scheme leafy \
            -configuration Debug -testLanguage zh-Hans -testRegion CN \
            -destination "platform=iOS Simulator,id=$LEAFY_TEST_DEVICE" \
            -derivedDataPath "$LEAFY_DERIVED_DATA" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/leafy-source-packages" \
            -resultBundlePath "${RUNNER_TEMP}/leafy-tests.xcresult" \
            -parallel-testing-enabled NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO
      - name: Export readable XCTest results
        if: ${{ always() && inputs.full }}
        run: |
          if [ -d "$RUNNER_TEMP/leafy-tests.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/leafy-tests.xcresult" > "$RUNNER_TEMP/leafy-test-summary.json"
            cat "$RUNNER_TEMP/leafy-test-summary.json"
          fi
      - name: Preserve XCTest diagnostics
        if: ${{ always() && inputs.full }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-tests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/leafy-tests.xcresult
            ${{ runner.temp }}/leafy-test-summary.json
          if-no-files-found: ignore
