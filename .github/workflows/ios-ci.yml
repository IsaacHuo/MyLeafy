name: iOS CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: iOS 17 build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/leafy-source-packages
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('leafy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Build for the iOS 17 deployment target
        run: |
          xcodebuild -quiet build \
            -project leafy.xcodeproj \
            -scheme leafy \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/leafy-source-packages" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Offline XCTest suite
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -quiet test -project leafy.xcodeproj -scheme leafy \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/leafy-source-packages" \
            -resultBundlePath "${RUNNER_TEMP}/leafy-tests.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Preserve XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-tests-${{ github.sha }}
          path: ${{ runner.temp }}/leafy-tests.xcresult
          if-no-files-found: ignore
