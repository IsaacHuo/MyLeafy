name: Site CI

on:
  workflow_call:
    inputs:
      full:
        description: Run compilation and the complete regression suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  site:
    name: ${{ inputs.full && 'Unit tests and production build' || 'Website and admin types' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        if: ${{ !inputs.full }}
        run: npm run typecheck

      - name: Run unit tests
        if: inputs.full
        run: npm test

      - name: Build website and admin
        if: inputs.full
        run: npm run build

      - name: Install browser runtimes and system dependencies
        if: inputs.full
        run: npx playwright install --with-deps chromium webkit

      - name: Browser acceptance tests
        if: inputs.full
        run: npm run test:e2e
      - name: Preserve browser diagnostics
        if: ${{ always() && inputs.full }}
        uses: actions/upload-artifact@v4
        with:
          name: site-tests-${{ github.sha }}
          path: |
            site/test-results/
            site/playwright-report/
          if-no-files-found: ignore
