name: Android CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Assemble, test and lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Kotlin and Gradle formatting
        run: |
          ./gradlew spotlessCheck || {
            echo 'Run ./gradlew spotlessApply in android/ and commit the task-owned changes.'
            exit 1
          }

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run JVM tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew :app:lintDebug

      - name: Compile release Kotlin (R8 input)
        run: ./gradlew :app:compileReleaseKotlin

      - name: Run Android lint (release)
        run: ./gradlew :app:lintRelease

      - name: Verify Roborazzi screenshots
        run: ./gradlew :app:verifyRoborazziDebug -Pscreenshot

      - name: Upload Roborazzi reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-${{ github.sha }}
          path: |
            android/app/build/reports/roborazzi/**
            android/app/build/outputs/roborazzi/**
            android/app/build/test-results/**
          if-no-files-found: ignore

  instrumented:
    name: Instrumented Room and navigation tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 2147483647
            adb shell input keyevent 82
            cd android && ./gradlew :app:connectedDebugAndroidTest