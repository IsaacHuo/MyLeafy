name: Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - "contracts/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "contracts/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Assemble, test and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run JVM tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew :app:lintDebug

      - name: Verify Roborazzi screenshots
        run: ./gradlew :app:verifyRoborazziDebug -Pscreenshot

      - name: Upload Roborazzi reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-${{ github.sha }}
          path: |
            android/app/build/reports/roborazzi/**
            android/app/build/outputs/roborazzi/**
            android/app/build/test-results/**
          if-no-files-found: ignore
