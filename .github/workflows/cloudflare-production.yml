name: Publish accepted Cloudflare version
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full commit SHA accepted in staging'
        required: true
        type: string
      staging_run:
        description: 'Successful staging Actions run ID'
        required: true
        type: string
      accepted:
        description: 'I have reviewed and accepted this staging version'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/main' && inputs.accepted
    runs-on: ubuntu-24.04
    env:
      RELEASE_COMMIT: ${{ inputs.commit }}
      STAGING_RUN: ${{ inputs.staging_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
      - name: Verify acceptance evidence before approval
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$STAGING_RUN" =~ ^[0-9]+$ ]]
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN" --jq '.path == ".github/workflows/cloudflare-staging.yml" and .head_branch == "main" and .conclusion == "success"' | grep -qx true
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-staging-${{ inputs.commit }}
          path: acceptance
          run-id: ${{ inputs.staging_run }}
          github-token: ${{ github.token }}
      - name: Show source, migrations and staging checks for approval
        run: |
          jq -e '.environment == "staging" and .commit == env.RELEASE_COMMIT and .success == true' acceptance/deployment.json
          {
            echo '## Selected Cloudflare publication'
            git show -s --format='%H%n%n%s' "$RELEASE_COMMIT"
            echo '### Staging checks'
            jq -r '.checks[]' acceptance/deployment.json
            echo '### Migration files in the selected source (D1 applies only pending files)'
            git ls-tree -r --name-only "$RELEASE_COMMIT" backend/migrations
            echo 'Order: D1 migration → Worker → website → public verification.'
          } >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: review
    if: github.ref == 'refs/heads/main' && inputs.accepted
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      RELEASE_COMMIT: ${{ inputs.commit }}
      STAGING_RUN: ${{ inputs.staging_run }}
      CLOUDFLARE_ACCOUNT_ID: be7d850d4b5046381fb909251b4df675
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
      - name: Verify staging run
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN" --jq '.path == ".github/workflows/cloudflare-staging.yml" and .head_branch == "main" and .conclusion == "success"' | grep -qx true
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-staging-${{ inputs.commit }}
          path: acceptance
          run-id: ${{ inputs.staging_run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 25.6.1
      - name: Build selected version
        run: |
          npm --prefix backend ci
          npm --prefix site ci
          npm --prefix site run build
      - name: Publish and verify selected version
        run: node backend/scripts/deploy-cloudflare.mjs production
      - name: Preserve recovery bookmark and publication results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-${{ inputs.commit }}
          path: deployment-report/
          if-no-files-found: ignore
      - name: Publication summary
        run: cat deployment-report/deployment.json >> "$GITHUB_STEP_SUMMARY"
